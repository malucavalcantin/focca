# Sobe o Focca em microsserviços, cada componente em seu contêiner:
#   docker compose up --build
#
# Portas visíveis fora do Docker: SÓ o gateway (8080) e o Discovery (3000).
# Os serviços de domínio (notas, frequencia) e os bancos (db-notas,
# db-frequencia) não publicam porta: só são acessíveis pela rede interna.
#
# Database per service: cada serviço tem o SEU servidor PostgreSQL, com volume,
# usuário e senha próprios. Um serviço não conhece as credenciais do outro.
#
# Cada componente é um projeto independente: o build usa só a sua pasta.
# Healthchecks garantem a ordem de subida: bancos e Discovery, depois os
# serviços, por último o gateway.

services:
  discovery:
    build: ./discovery
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/saude').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-notas:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notas
      POSTGRES_USER: servico_notas
      POSTGRES_PASSWORD: notas_senha_local
    volumes:
      - dados-db-notas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servico_notas -d notas"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  notas:
    build: ./servico-notas
    environment:
      HOST: notas
      DISCOVERY_URL: http://discovery:3000
      DATABASE_URL: postgres://servico_notas:notas_senha_local@db-notas:5432/notas
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/saude').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      discovery:
        condition: service_healthy
      db-notas:
        condition: service_healthy
    restart: unless-stopped

  db-frequencia:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frequencia
      POSTGRES_USER: servico_frequencia
      POSTGRES_PASSWORD: frequencia_senha_local
    volumes:
      - dados-db-frequencia:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servico_frequencia -d frequencia"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frequencia:
    build: ./servico-frequencia
    environment:
      HOST: frequencia
      DISCOVERY_URL: http://discovery:3000
      DATABASE_URL: postgres://servico_frequencia:frequencia_senha_local@db-frequencia:5432/frequencia
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/saude').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      discovery:
        condition: service_healthy
      db-frequencia:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      DISCOVERY_URL: http://discovery:3000
    ports:
      - "8080:8080"
    depends_on:
      discovery:
        condition: service_healthy
      notas:
        condition: service_healthy
      frequencia:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados-db-notas:
  dados-db-frequencia:
